name: Build LdSSHManager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            build_platform: windows/amd64
            extra_flags: -nsis -webview2 embed
            out_bin: build/bin/LdSSHManager.exe
            out_installer_glob: build/bin/*installer*.exe
            portable_name: LdSSHManager-x64.exe
            installer_name: LdSSHManager-Install-x64.exe
          - os: ubuntu-latest
            label: linux
            build_platform: linux/amd64
            extra_flags: -tags webkit2_41
            out_bin: build/bin/LdSSHManager
            out_installer_glob: ""
            portable_name: LdSSHManager-linux-x64
            installer_name: ""
          - os: macos-latest
            label: macos
            build_platform: darwin/arm64
            extra_flags: ""
            out_bin: ""
            out_installer_glob: ""
            portable_name: LdSSHManager-macos-arm64.dmg
            installer_name: ""
          - os: macos-13
            label: macos-intel
            build_platform: darwin/amd64
            extra_flags: ""
            out_bin: ""
            out_installer_glob: ""
            portable_name: LdSSHManager-macos-x64.dmg
            installer_name: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Linux: GTK3 + WebKit2GTK(4.1) + gcc(CGO) —— Wails Linux 构建的系统依赖
      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # Windows: go-sqlcipher 是 CGO 驱动, 需要 gcc
      - name: Install GCC (MSYS2 + MinGW-w64)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          winget install --id MSYS2.MSYS2 -e --silent --accept-package-agreements --accept-source-agreements
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc"
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Windows: wails build -nsis 需要 makensis
      - name: Install NSIS (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # 从 app.go 的 GetVersion() 动态读取版本号 (如 v0.8.46)
      - name: Extract version from app.go
        id: version
        shell: bash
        run: |
          VER=$(sed -n 's/.*return "v\([0-9.]*\)".*/\1/p' app.go | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER"

      # wails 会自动执行前端 npm install + build, 无需单独步骤
      - name: Build (Wails)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: wails build -platform ${{ matrix.build_platform }} ${{ matrix.extra_flags }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # macOS: wails 产出 .app, 用 hdiutil 制作 dmg; 失败则兜底 zip 打包 .app
          if [[ "${{ matrix.label }}" == macos* ]]; then
            if [ -d "build/bin/LdSSHManager.app" ]; then
              hdiutil create -volname "LdSSHManager" -srcfolder build/bin/LdSSHManager.app -ov -format UDZO "artifacts/${{ matrix.portable_name }}"
              if [ -f "artifacts/${{ matrix.portable_name }}" ]; then
                echo "DMG created: artifacts/${{ matrix.portable_name }}"
              else
                echo "hdiutil failed, falling back to zip"
                (cd build/bin && zip -qr "../../artifacts/LdSSHManager-${{ matrix.label }}.zip" LdSSHManager.app)
              fi
            fi
            ls -la artifacts
            exit 0
          fi
          if [ -n "${{ matrix.out_bin }}" ] && [ -f "${{ matrix.out_bin }}" ]; then
            cp "${{ matrix.out_bin }}" "artifacts/${{ matrix.portable_name }}"
          fi
          if [ -n "${{ matrix.out_installer_glob }}" ]; then
            for f in ${{ matrix.out_installer_glob }}; do
              cp "$f" "artifacts/${{ matrix.installer_name }}"
            done
          fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LdSSHManager-${{ matrix.label }}-v${{ steps.version.outputs.version }}
          path: artifacts/

  # 等待两个平台都构建完成后, 合并产物统一发布到 latest Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from app.go
        id: version
        shell: bash
        run: |
          VER=$(sed -n 's/.*return "v\([0-9.]*\)".*/\1/p' app.go | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 每次 push 都更新固定 "latest" Release
      - name: Delete old latest release
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        shell: bash
        run: gh release delete latest --yes --cleanup-tag

      - name: Create latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LdSSHManager v${{ steps.version.outputs.version }} (latest)
          body: |
            最新自动构建 · v${{ steps.version.outputs.version }}

            **Windows**
            - `LdSSHManager-x64.exe` 绿色便携版（免安装，双击运行）
            - `LdSSHManager-Install-x64.exe` NSIS 安装版（自定义安装目录/快捷方式/卸载）

            **Linux**
            - `LdSSHManager-linux-x64` 可执行文件（需桌面环境 + WebKit2GTK，见 README）

            **macOS**
            - `LdSSHManager-macos-arm64.dmg` 磁盘镜像（Apple Silicon M 系列）
            - `LdSSHManager-macos-x64.dmg` 磁盘镜像（Intel Mac）
            - 首次打开需右键 → 打开（未签名）

            官网：https://www.gxlidang.com/soft/ldsshmanager
          files: artifacts/*
